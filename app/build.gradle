plugins { id 'com.android.application' }

android {
    namespace 'com.edgeenhance'
    compileSdk 35
    defaultConfig {
        applicationId 'com.edgeenhance'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1-beta1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Compile-time API only. LSPosed provides the implementation at runtime.
    compileOnly 'de.robv.android.xposed:api:82'
}
