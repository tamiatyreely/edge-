
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        // Xposed API 仓库
        maven {
            url 'https://api.xposed.info/'
        }

        // 备用仓库
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
    }
}

rootProject.name = "EdgeEnhance"
include ':app'
